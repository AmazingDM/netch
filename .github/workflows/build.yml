name: Netch Build CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x

      - name: Setup C++
        uses: msys2/setup-msys2@v2
        with:
          update: true
          release: true
          install: base-devel git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-libevent mingw-w64-x86_64-pcre2 mingw-w64-x86_64-freetype mingw-w64-x86_64-libpng mingw-w64-x86_64-bzip2 mingw-w64-x86_64-openssl mingw-w64-x86_64-mbedtls mingw-w64-x86_64-libsodium mingw-w64-x86_64-c-ares mingw-w64-x86_64-boost mingw-w64-x86_64-libmariadbclient unzip p7zip autoconf automake libtool

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache Netch
        uses: actions/cache@v5
        with:
          key: Netch-${{ runner.os }}-Netch-${{ hashFiles('Netch/**', 'common.props') }}
          path: .\Netch\bin

      - name: Cache Other
        uses: actions/cache@v5
        with:
          key: Netch-${{ runner.os }}-Other-${{ hashFiles('Other/**') }}
          path: .\Other\release

      - name: Cache Redirector
        uses: actions/cache@v5
        with:
          key: Netch-${{ runner.os }}-Redirector-${{ hashFiles('Redirector/**') }}
          path: .\Redirector\bin

      - name: Cache RouteHelper
        uses: actions/cache@v5
        with:
          key: Netch-${{ runner.os }}-RouteHelper-${{ hashFiles('RouteHelper/**') }}
          path: .\RouteHelper\bin

      - name: Restore
        run: |
          dotnet restore .\Netch\Netch.csproj
          dotnet restore .\Tests\Tests.csproj
          dotnet restore .\RedirectorTester\RedirectorTester.csproj

      - name: Build Managed Projects
        run: |
          dotnet build .\Netch\Netch.csproj -c Release --no-restore -p:Platform=x64
          dotnet build .\RedirectorTester\RedirectorTester.csproj -c Release --no-restore

      - name: Run Tests
        run: dotnet test .\Tests\Tests.csproj -c Release --no-build

      - name: Build Release Bundle
        run: .\build.ps1 -Configuration Release -OutputPath release

      - name: Verify Bundle Contents
        run: |
          $required = @(
            "release\Netch.exe",
            "release\bin\Redirector.bin",
            "release\bin\RouteHelper.bin"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing.Count -gt 0) {
            throw "Missing required release artifacts: $($missing -join ', ')"
          }

      - name: Upload Bundle
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release
